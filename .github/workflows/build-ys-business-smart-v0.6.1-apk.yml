name: Build YS Business Smart v0.6.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-ys-business-smart-v0.6.1-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Recreate YS Business Smart v0.6.1 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ys-business-smart-v061 YS_Business_Smart_v0.6.1
          printf '%s' '' | base64 -d > /tmp/ys-v061.tar.gz
          tar -xzf /tmp/ys-v061.tar.gz
          mv YS_Business_Smart_v0.6.1 ys-business-smart-v061

      - name: Add Arabic and English OCR language data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ys-business-smart-v061/app/src/main/assets/tessdata
          curl -L --fail --retry 3 --connect-timeout 20 -o ys-business-smart-v061/app/src/main/assets/tessdata/ara.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/ara.traineddata
          curl -L --fail --retry 3 --connect-timeout 20 -o ys-business-smart-v061/app/src/main/assets/tessdata/eng.traineddata https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata
          test -s ys-business-smart-v061/app/src/main/assets/tessdata/ara.traineddata
          test -s ys-business-smart-v061/app/src/main/assets/tessdata/eng.traineddata

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f ys-business-smart-v061/app/src/main/assets/www/app.js
          test -f ys-business-smart-v061/app/src/main/java/com/ysbusiness/mobile/MainActivity.java
          node --check ys-business-smart-v061/app/src/main/assets/www/app.js
          grep -q "versionName '0.6.1'" ys-business-smart-v061/app/build.gradle
          grep -q "analyzePriceImage" ys-business-smart-v061/app/src/main/java/com/ysbusiness/mobile/MainActivity.java
          grep -q "startSpeechRecognition" ys-business-smart-v061/app/src/main/java/com/ysbusiness/mobile/MainActivity.java

      - name: Build debug APK
        working-directory: ys-business-smart-v061
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp ys-business-smart-v061/app/build/outputs/apk/debug/app-debug.apk output/YS-Business-Smart-v0.6.1.apk
          sha256sum output/YS-Business-Smart-v0.6.1.apk > output/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-v0.6.1-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
