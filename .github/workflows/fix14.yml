name: Build YS Business Smart Clean Fix 14 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build clean verified Android Fix 14
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore complete clean Fix 14 project
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > ys-fix14.zip
          rm -rf YS_Business_Smart_Rebuild_Phase1
          unzip -q ys-fix14.zip

      - name: Verify requested fixes are really present
        shell: bash
        run: |
          set -euo pipefail
          ROOT="YS_Business_Smart_Rebuild_Phase1"
          test -f "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_one.png"
          test -f "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_two.png"
          test ! -f "$ROOT/app/src/main/java/com/ysbusiness/smart/SplashActivity.kt"
          ! grep -R "SplashActivity" "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q "delay(700)" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "delay(4_300)" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          ! grep -q "delay(5_000)" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "showAccountMenu" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "DashboardSettingsDialog" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "storeLogoUri" "$ROOT/app/src/main/java/com/ysbusiness/smart/data/AppPreferences.kt"
          grep -q 'versionName = "1.0.14-phase1-fix14"' "$ROOT/app/build.gradle.kts"
          echo "All Fix 14 source checks passed."

      - name: Run unit tests
        shell: bash
        run: |
          gradle -p YS_Business_Smart_Rebuild_Phase1 testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p YS_Business_Smart_Rebuild_Phase1 assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk              output/YS-Business-Smart-Clean-Fix14.apk
          sha256sum output/YS-Business-Smart-Clean-Fix14.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Clean-Fix14
          path: output/
          if-no-files-found: error
          retention-days: 30
