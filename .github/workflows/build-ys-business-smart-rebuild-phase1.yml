name: Build YS Business Smart Rebuild Phase 1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-ys-business-smart-rebuild-phase1.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android Phase 1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore Phase 1 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf YS_Business_Smart_Rebuild_Phase1
          printf '%s' '' | base64 -d > phase1.zip
          unzip -q phase1.zip
          test -f YS_Business_Smart_Rebuild_Phase1/app/build.gradle.kts

      - name: Run unit tests
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk output/YS-Business-Smart-Rebuild-Phase1.apk
          sha256sum output/YS-Business-Smart-Rebuild-Phase1.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Rebuild-Phase1-APK
          path: output/
          if-no-files-found: error
          retention-days: 14
