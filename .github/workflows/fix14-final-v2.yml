name: Build YS Business Smart Fix 14 FINAL V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix14-final-v2.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Fix 14 Final V2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore complete Fix 14 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="aacf599607498373e0fda8cfc6f9c31bb73a5c48"
          git show "${SOURCE_COMMIT}:.github/workflows/fix14.yml" > /tmp/fix14-embedded.yml

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          text = Path("/tmp/fix14-embedded.yml").read_text(encoding="utf-8")
          pattern = r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > ys-fix14\.zip"
          match = re.search(pattern, text)
          if not match:
              raise SystemExit("Embedded Fix 14 project archive was not found")

          Path("ys-fix14.zip").write_bytes(base64.b64decode(match.group(1)))
          PY

          rm -rf YS_Business_Smart_Rebuild_Phase1
          unzip -q ys-fix14.zip
          test -f YS_Business_Smart_Rebuild_Phase1/settings.gradle.kts

      - name: Fix missing Compose imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "YS_Business_Smart_Rebuild_Phase1/"
              "app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          )
          text = path.read_text(encoding="utf-8")

          required_imports = [
              "import androidx.compose.foundation.border",
              "import androidx.compose.ui.draw.clip",
          ]

          missing = [item for item in required_imports if item not in text]
          if missing:
              anchor = "import androidx.compose.foundation.background\n"
              if anchor not in text:
                  raise SystemExit("Could not locate import section in Components.kt")
              text = text.replace(
                  anchor,
                  anchor + "\n".join(missing) + "\n",
                  1,
              )
              path.write_text(text, encoding="utf-8")

          final_text = path.read_text(encoding="utf-8")
          for item in required_imports:
              if item not in final_text:
                  raise SystemExit(f"Missing required import after patch: {item}")

          print("Components.kt Compose imports fixed.")
          PY

      - name: Verify Fix 14 source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="YS_Business_Smart_Rebuild_Phase1"
          test -f "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_one.png"
          test -f "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_two.png"
          test ! -f "$ROOT/app/src/main/java/com/ysbusiness/smart/SplashActivity.kt"
          ! grep -R "SplashActivity" "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q "delay(700)" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "delay(4_300)" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "showAccountMenu" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "DashboardSettingsDialog" "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "storeLogoUri" "$ROOT/app/src/main/java/com/ysbusiness/smart/data/AppPreferences.kt"
          grep -q 'import androidx.compose.foundation.border' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          grep -q 'import androidx.compose.ui.draw.clip' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p YS_Business_Smart_Rebuild_Phase1 \
            clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp \
            YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk \
            output/YS-Business-Smart-Fix14-Final-V2.apk
          sha256sum output/YS-Business-Smart-Fix14-Final-V2.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Fix14-Final-V2
          path: output/
          if-no-files-found: error
          retention-days: 30
