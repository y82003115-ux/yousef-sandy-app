name: Build YS Business Smart Neon Fix 15 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix15-neon-redesign.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Neon Redesign Fix 15
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable Fix 14 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="aacf599607498373e0fda8cfc6f9c31bb73a5c48"
          git show "${SOURCE_COMMIT}:.github/workflows/fix14.yml" > /tmp/fix14-embedded.yml
          python3 - <<'PYRESTORE'
          from pathlib import Path
          import base64
          import re
          text = Path('/tmp/fix14-embedded.yml').read_text(encoding='utf-8')
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > ys-fix14\.zip", text)
          if not match:
              raise SystemExit('Embedded Fix 14 source archive was not found')
          Path('ys-fix14.zip').write_bytes(base64.b64decode(match.group(1)))
          PYRESTORE
          rm -rf YS_Business_Smart_Rebuild_Phase1
          unzip -q ys-fix14.zip
          test -f YS_Business_Smart_Rebuild_Phase1/settings.gradle.kts

      - name: Apply complete Neon Fix 15 redesign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/App.kt')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/App.kt'
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/Components.kt')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/Components.kt'
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/BusinessModels.kt')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/BusinessModels.kt'
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt'
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/theme/Theme.kt')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/app/src/main/java/com/ysbusiness/smart/ui/theme/Theme.kt'
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/app/build.gradle.kts')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/app/build.gradle.kts'
          mkdir -p "$(dirname 'YS_Business_Smart_Rebuild_Phase1/README_FIX15_AR.md')"
          printf '%s' '' | base64 -d > 'YS_Business_Smart_Rebuild_Phase1/README_FIX15_AR.md'

      - name: Verify requested design and sections
        shell: bash
        run: |
          set -euo pipefail
          ROOT="YS_Business_Smart_Rebuild_Phase1"
          grep -q 'versionName = "1.0.15-neon-redesign"' "$ROOT/app/build.gradle.kts"
          grep -q 'fun NeonBackdrop' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          grep -q 'fun BusinessArea' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'InventoryScreen' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'CashierScreen' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'CustomersScreen' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'ReportsScreen' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'ExpensesScreen' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'SmartCenterScreen' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q 'delay(700)' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q 'delay(4_300)' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          echo "Neon Fix 15 source verification passed."

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p YS_Business_Smart_Rebuild_Phase1 clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk output/YS-Business-Smart-Neon-Fix15.apk
          zip -qr output/YS-Business-Smart-Neon-Fix15-Source.zip YS_Business_Smart_Rebuild_Phase1
          sha256sum output/YS-Business-Smart-Neon-Fix15.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Neon-Fix15
          path: output/
          if-no-files-found: error
          retention-days: 30
