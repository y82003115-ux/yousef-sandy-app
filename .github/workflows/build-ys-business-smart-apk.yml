      - name: Validate JavaScript
        shell: bash
        run: node --check ys-business-smart-build/app/src/main/assets/www/app.js

      - name: Build APK
        shell: bash
        run: gradle -p ys-business-smart-build :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare downloadable APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp ys-business-smart-build/app/build/outputs/apk/debug/app-debug.apk apk-output/YS-Business-Smart-Phase1-v0.4.0.apk
          sha256sum apk-output/YS-Business-Smart-Phase1-v0.4.0.apk > apk-output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 30
