name: Build YS Business Smart Final 20260801 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-ys-business-smart-final-20260801.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android Final 20260801
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore Fix 10 base project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib, base64
          text = pathlib.Path(".github/workflows/build-ys-business-smart-rebuild-phase1-fix10.yml").read_text()
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > phase1-fix10\.zip", text)
          if not match:
              raise SystemExit("Fix 10 embedded project was not found")
          pathlib.Path("phase1-fix10.zip").write_bytes(base64.b64decode(match.group(1)))
          PY
          rm -rf YS_Business_Smart_Rebuild_Phase1
          unzip -q phase1-fix10.zip

      - name: Apply final Fix 11 files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="YS_Business_Smart_Rebuild_Phase1"
          rm -f "$ROOT/app/src/main/res/drawable-nodpi/splash_screen.png"
          rm -f "$ROOT/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png"
          rm -f "$ROOT"/app/src/main/res/mipmap-*/ic_launcher.png
          rm -f "$ROOT"/app/src/main/res/mipmap-*/ic_launcher_round.png
          mkdir -p "$ROOT/app"
          printf '%s' '' | base64 -d > "$ROOT/app/build.gradle.kts"
          mkdir -p "$ROOT/app/src/main/java/com/ysbusiness/smart/ui"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          mkdir -p "$ROOT/app/src/main/res/values"
          printf '%s' 'PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxjb2xvciBuYW1lPSJsYXVuY2hlcl9iZyI+IzA1MDcyNzwvY29sb3I+CjwvcmVzb3VyY2VzPgo=' | base64 -d > "$ROOT/app/src/main/res/values/colors.xml"
          mkdir -p "$ROOT/app/src/main/res/values-v31"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/values-v31/themes.xml"
          mkdir -p "$ROOT/app/src/main/res/drawable-nodpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/drawable-nodpi/splash_screen.webp"
          mkdir -p "$ROOT/app/src/main/res/drawable-nodpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-mdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-mdpi/ic_launcher.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-mdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-mdpi/ic_launcher_round.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-hdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-hdpi/ic_launcher.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-hdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-hdpi/ic_launcher_round.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xhdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-xhdpi/ic_launcher.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xhdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-xhdpi/ic_launcher_round.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xxhdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-xxhdpi/ic_launcher.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xxhdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xxxhdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xxxhdpi"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp"
          test -f "$ROOT/app/src/main/res/drawable-nodpi/splash_screen.webp"
          grep -q 'versionName = "1.0.11-phase1-fix11"' "$ROOT/app/build.gradle.kts"
          grep -q 'delay(5_000)' "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"

      - name: Run unit tests
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk output/YS-Business-Smart-Final-20260801.apk
          sha256sum output/YS-Business-Smart-Final-20260801.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Final-20260801-APK
          path: output/
          if-no-files-found: error
          retention-days: 14
