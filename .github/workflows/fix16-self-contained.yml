          test -f "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -Fq "CompositionLocalProvider(LocalContentColor provides foreground)" "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          grep -Fq "private fun BusinessTopBar" "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -Fq "delay(700)" "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -Fq "delay(4_300)" "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          test -f "$PROJECT_ROOT/app/src/main/res/drawable-nodpi/neon_bg_dark.webp"
          test -f "$PROJECT_ROOT/app/src/main/res/drawable-nodpi/neon_bg_light.webp"

      - name: Set Fix 16 version
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["PROJECT_ROOT"]) / "app" / "build.gradle.kts"
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 16', text, count=1)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.16-restored-self-contained"', text, count=1)
          path.write_text(text, encoding="utf-8")
          PYCODE

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_ROOT" clean assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name "*.apk" -print -quit)"
          test -n "$APK_PATH"
          mkdir -p output
          cp "$APK_PATH" output/YS-Business-Smart-Fix16-Self-Contained.apk
          sha256sum output/YS-Business-Smart-Fix16-Self-Contained.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Fix16-Self-Contained
          path: output/
          if-no-files-found: error
          retention-days: 30
