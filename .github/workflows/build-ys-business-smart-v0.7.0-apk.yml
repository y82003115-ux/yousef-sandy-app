          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/eng.traineddata" \
            -o "$TESS_DIR/eng.traineddata"
          test -s "$TESS_DIR/ara.traineddata"
          test -s "$TESS_DIR/eng.traineddata"

      - name: Validate web application
        shell: bash
        run: |
          set -euo pipefail
          node --check YS_Business_Smart_v0.7.0/app/src/main/assets/www/app.js
          test -s YS_Business_Smart_v0.7.0/app/src/main/assets/www/index.html
          test -s YS_Business_Smart_v0.7.0/app/src/main/assets/www/styles.css

      - name: Build debug APK
        working-directory: YS_Business_Smart_v0.7.0
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare downloadable APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp YS_Business_Smart_v0.7.0/app/build/outputs/apk/debug/app-debug.apk \
            artifact/YS-Business-Smart-v0.7.0-Rebuild.apk
          sha256sum artifact/YS-Business-Smart-v0.7.0-Rebuild.apk > artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-v0.7.0-Rebuild-APK
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
