name: Build YS Business Smart Fix 16 Restored V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix16-build-v2.yml"
      - ".github/workflows/fix16-source.zip"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Fix 16 Restored Design V2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract and locate Fix 16 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=".github/workflows/fix16-source.zip"
          test -s "$ZIP_PATH"

          rm -rf fix16-build
          mkdir -p fix16-build
          unzip -q "$ZIP_PATH" -d fix16-build

          SETTINGS_FILE="$(find fix16-build -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts was not found after extraction."
            find fix16-build -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $PROJECT_ROOT"

      - name: Verify restored design files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/README_FIX16_AR.md"
          test -f "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          test -f "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          test -f "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"

          grep -Fq "CompositionLocalProvider(LocalContentColor provides foreground)"             "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          grep -Fq "private fun BusinessTopBar"             "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -Fq "delay(700)"             "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -Fq "delay(4_300)"             "$PROJECT_ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"

      - name: Set Fix 16 version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PROJECT_ROOT"]) / "app" / "build.gradle.kts"
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'versionName = "1.0.15-neon-redesign"',
              'versionName = "1.0.16-restored-design-v2"'
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_ROOT"             clean assembleDebug             --no-daemon             --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name "*.apk" -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK_PATH" output/YS-Business-Smart-Fix16-Restored-V2.apk
          sha256sum output/YS-Business-Smart-Fix16-Restored-V2.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Fix16-Restored-V2
          path: output/
          if-no-files-found: error
          retention-days: 30
