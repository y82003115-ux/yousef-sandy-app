name: Build YS Business Smart Fix 16 Restored APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix16-build.yml"
      - ".github/workflows/fix16-source.zip"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Fix 16 Restored Design
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Fix 16 source
        shell: bash
        run: |
          set -euo pipefail
          test -s ".github/workflows/fix16-source.zip"
          rm -rf fix16-build
          mkdir -p fix16-build
          unzip -q ".github/workflows/fix16-source.zip" -d fix16-build
          test -f "fix16-build/YS_Business_Smart_Fix16/settings.gradle.kts"

      - name: Verify restored design files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="fix16-build/YS_Business_Smart_Fix16"
          grep -q "Fix 16" "$ROOT/README_FIX16_AR.md"
          grep -q "CompositionLocalProvider(LocalContentColor provides foreground)"             "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/Components.kt"
          grep -q "private fun DashboardTopBar"             "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/BusinessScreens.kt"
          grep -q "delay(700)"             "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"
          grep -q "delay(4_300)"             "$ROOT/app/src/main/java/com/ysbusiness/smart/ui/App.kt"

      - name: Set Fix 16 version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("fix16-build/YS_Business_Smart_Fix16/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'versionName = "1.0.15-neon-redesign"',
              'versionName = "1.0.16-restored-design"'
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p fix16-build/YS_Business_Smart_Fix16             clean assembleDebug             --no-daemon             --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp             fix16-build/YS_Business_Smart_Fix16/app/build/outputs/apk/debug/app-debug.apk             output/YS-Business-Smart-Fix16-Restored.apk
          sha256sum output/YS-Business-Smart-Fix16-Restored.apk > output/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Fix16-Restored
          path: output/
          if-no-files-found: error
          retention-days: 30
