name: Build YS Business Smart Owner Neon Fix 12 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-ys-business-smart-owner-neon-fix12.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android Owner Neon Fix 12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore Fix 10 base project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBASE'
          import re, pathlib, base64
          text = pathlib.Path(".github/workflows/build-ys-business-smart-rebuild-phase1-fix10.yml").read_text()
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > phase1-fix10\.zip", text)
          if not match: raise SystemExit("Fix 10 embedded project was not found")
          pathlib.Path("phase1-fix10.zip").write_bytes(base64.b64decode(match.group(1)))
          PYBASE
          rm -rf YS_Business_Smart_Rebuild_Phase1
          unzip -q phase1-fix10.zip
      - name: Reapply final Fix 11 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX11'
          from pathlib import Path
          text = Path(".github/workflows/build-ys-business-smart-final-20260801.yml").read_text()
          start = text.index("      - name: Apply final Fix 11 files\n")
          run_start = text.index("        run: |\n", start) + len("        run: |\n")
          end = text.index("\n      - name: Run unit tests", run_start)
          block = text[run_start:end]
          lines = [line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          Path("/tmp/apply_fix11.sh").write_text("\n".join(lines) + "\n")
          PYFIX11
          bash /tmp/apply_fix11.sh
      - name: Apply owner screen refinement Fix 12
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fix12.py <<'PYPATCH'
          from pathlib import Path
          root=Path('YS_Business_Smart_Rebuild_Phase1')
          p=root/'app/src/main/java/com/ysbusiness/smart/ui/App.kt'
          s=p.read_text()
          # imports
          if 'import androidx.compose.foundation.border' not in s:
              s=s.replace('import androidx.compose.foundation.background\n','import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n')
          if 'import androidx.compose.foundation.shape.CircleShape' not in s:
              s=s.replace('import androidx.compose.foundation.shape.RoundedCornerShape\n','import androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\n')
          # owner call
          s=s.replace('''                    Screen.OWNER -> OwnerScreen(
                                  s = strings,
                                  onBack = { screen = Screen.STORE },''','''                    Screen.OWNER -> OwnerScreen(
                                  s = strings,
                                  darkMode = current.darkMode,
                                  language = current.language,
                                  onTheme = { scope.launch { preferences.setTheme(it) } },
                                  onLanguage = { scope.launch { preferences.setLanguage(it) } },
                                  onBack = { screen = Screen.STORE },''',1)
          # signature
          s=s.replace('''private fun OwnerScreen(
              s: S,
              onBack: () -> Unit,''','''private fun OwnerScreen(
              s: S,
              darkMode: Boolean,
              language: AppLanguage,
              onTheme: (Boolean) -> Unit,
              onLanguage: (AppLanguage) -> Unit,
              onBack: () -> Unit,''',1)
          # top row
          s=s.replace('''        IconButton(onClick = onBack) { Icon(Icons.Rounded.ArrowForward, null) }
                  Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {''','''        CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr) {
                      Row(
                          modifier = Modifier.fillMaxWidth().height(52.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          HeaderActionButton(
                              icon = if (darkMode) Icons.Rounded.LightMode else Icons.Rounded.DarkMode,
                              tint = if (darkMode) Color(0xFFFFC857) else Color(0xFF1C3557),
                              onClick = { onTheme(!darkMode) }
                          )
                          Spacer(Modifier.width(10.dp))
                          LanguageMenu(language, onLanguage)
                          Spacer(Modifier.weight(1f))
                          HeaderActionButton(
                              icon = Icons.Rounded.ArrowBack,
                              tint = MaterialTheme.colorScheme.onSurface,
                              onClick = onBack
                          )
                      }
                  }
                  Spacer(Modifier.height(12.dp))
                  Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.fillMaxWidth()) {''',1)
          # smaller image and neon ring by wrapping ProfileAvatar
          s=s.replace('''                ProfileAvatar(profileImageUri, 104.dp)''','''                Box(
                              modifier = Modifier
                                  .size(88.dp)
                                  .background(
                                      Brush.sweepGradient(listOf(Pink, Color(0xFF8B5CF6), Color(0xFF22D3EE), Pink)),
                                      CircleShape
                                  )
                                  .padding(3.dp),
                              contentAlignment = Alignment.Center
                          ) {
                              ProfileAvatar(profileImageUri, 80.dp)
                          }''',1)
          s=s.replace('Text(s.ownerAccount, fontSize = 28.sp, fontWeight = FontWeight.Black)','Text(s.ownerAccount, fontSize = 27.sp, fontWeight = FontWeight.Black)',1)
          # neon all AppFields by modifier and colors
          old='''        shape = RoundedCornerShape(18.dp),
                  modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)
              )'''
          new='''        shape = RoundedCornerShape(18.dp),
                  colors = OutlinedTextFieldDefaults.colors(
                      focusedBorderColor = Pink,
                      unfocusedBorderColor = Color(0xFF8B5CF6).copy(alpha = .72f),
                      focusedLeadingIconColor = Pink,
                      focusedLabelColor = Pink,
                      cursorColor = Pink,
                      focusedContainerColor = MaterialTheme.colorScheme.surface.copy(alpha = .42f),
                      unfocusedContainerColor = MaterialTheme.colorScheme.surface.copy(alpha = .32f)
                  ),
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(bottom = 12.dp)
                      .border(
                          0.7.dp,
                          Brush.horizontalGradient(listOf(Pink.copy(alpha = .55f), Color(0xFF2F80ED).copy(alpha = .55f))),
                          RoundedCornerShape(18.dp)
                      )
              )'''
          if old not in s: raise SystemExit('AppField target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          # bump version
          g=root/'app/build.gradle.kts'
          t=g.read_text().replace('versionCode = 12','versionCode = 13').replace('versionName = "1.0.11-phase1-fix11"','versionName = "1.0.12-phase1-fix12"')
          g.write_text(t)
          PYPATCH
          python3 /tmp/fix12.py
          grep -q 'versionName = "1.0.12-phase1-fix12"' YS_Business_Smart_Rebuild_Phase1/app/build.gradle.kts
      - name: Run unit tests
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare output
        shell: bash
        run: |
          mkdir -p output
          cp YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk output/YS-Business-Smart-Owner-Neon-Fix12.apk
          zip -qr output/YS-Business-Smart-Owner-Neon-Fix12-Source.zip YS_Business_Smart_Rebuild_Phase1
          sha256sum output/* > output/SHA256.txt
      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Owner-Neon-Fix12
          path: output/
          if-no-files-found: error
          retention-days: 14
