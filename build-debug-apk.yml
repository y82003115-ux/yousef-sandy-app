name: Build Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android files
        run: flutter create --platforms=android --org com.yousefsandy --project-name yousef_sandy_moment .

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: Yousef-Sandy-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
