name: Build YS Business Smart Dual Splash Fix 13 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/build-ys-business-smart-dual-splash-fix13.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build native Android Dual Splash Fix 13
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore Fix 10 base project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBASE'
          import re, pathlib, base64
          text = pathlib.Path(".github/workflows/build-ys-business-smart-rebuild-phase1-fix10.yml").read_text()
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d > phase1-fix10\.zip", text)
          if not match:
              raise SystemExit("Fix 10 embedded project was not found")
          pathlib.Path("phase1-fix10.zip").write_bytes(base64.b64decode(match.group(1)))
          PYBASE
          rm -rf YS_Business_Smart_Rebuild_Phase1
          unzip -q phase1-fix10.zip

      - name: Reapply final Fix 11 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX11'
          from pathlib import Path
          text = Path(".github/workflows/build-ys-business-smart-final-20260801.yml").read_text()
          start = text.index("      - name: Apply final Fix 11 files\n")
          run_start = text.index("        run: |\n", start) + len("        run: |\n")
          end = text.index("\n      - name: Run unit tests", run_start)
          block = text[run_start:end]
          lines = [line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          Path("/tmp/apply_fix11.sh").write_text("\n".join(lines) + "\n")
          PYFIX11
          bash /tmp/apply_fix11.sh

      - name: Reapply owner refinement Fix 12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX12'
          from pathlib import Path
          text = Path(".github/workflows/build-ys-business-smart-owner-neon-fix12.yml").read_text()
          start = text.index("      - name: Apply owner screen refinement Fix 12\n")
          run_start = text.index("        run: |\n", start) + len("        run: |\n")
          end = text.index("\n      - name: Run unit tests", run_start)
          block = text[run_start:end]
          lines = [line[10:] if line.startswith("          ") else line for line in block.splitlines()]
          Path("/tmp/apply_fix12.sh").write_text("\n".join(lines) + "\n")
          PYFIX12
          bash /tmp/apply_fix12.sh

      - name: Apply exact two-stage splash Fix 13
        shell: bash
        run: |
          set -euo pipefail
          ROOT="YS_Business_Smart_Rebuild_Phase1"
          mkdir -p "$ROOT/app/src/main/res/drawable-nodpi"
          mkdir -p "$ROOT/app/src/main/res/drawable"
          mkdir -p "$ROOT/app/src/main/res/values"
          mkdir -p "$ROOT/app/src/main/res/values-v31"
          mkdir -p "$ROOT/app/src/main/java/com/ysbusiness/smart"

          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_one.png"
          printf '%s' '' | base64 -d > "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_two.png"

          cat > "$ROOT/app/src/main/res/drawable/splash_transparent.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">
              <path
                  android:fillColor="#00000000"
                  android:pathData="M0,0h1v1h-1z" />
          </vector>
          XML

          cat > "$ROOT/app/src/main/res/values/splash_styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.YSBusinessSplash" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowDisablePreview">false</item>
                  <item name="android:windowBackground">@drawable/splash_stage_one</item>
                  <item name="android:colorAccent">#EC4899</item>
                  <item name="android:navigationBarColor">#020617</item>
                  <item name="android:statusBarColor">#020617</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          XML

          cat > "$ROOT/app/src/main/res/values-v31/splash_styles.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.YSBusinessSplash" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowDisablePreview">false</item>
                  <item name="android:windowBackground">@drawable/splash_stage_one</item>
                  <item name="android:windowSplashScreenBackground">#020617</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_transparent</item>
                  <item name="android:windowSplashScreenAnimationDuration">0</item>
                  <item name="android:navigationBarColor">#020617</item>
                  <item name="android:statusBarColor">#020617</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          XML

          cat > "$ROOT/app/src/main/java/com/ysbusiness/smart/SplashActivity.kt" <<'KOTLIN'
          package com.ysbusiness.smart

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView

          class SplashActivity : Activity() {
              private val handler = Handler(Looper.getMainLooper())

              private val showSecondStage = Runnable {
                  val image = findViewById<ImageView>(SPLASH_IMAGE_ID) ?: return@Runnable
                  image.animate()
                      .alpha(0f)
                      .setDuration(180L)
                      .withEndAction {
                          image.setImageResource(R.drawable.splash_stage_two)
                          image.alpha = 0f
                          image.animate().alpha(1f).setDuration(320L).start()
                      }
                      .start()
              }

              private val openApplication = Runnable {
                  startActivity(Intent(this, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  })
                  overridePendingTransition(0, 0)
                  finish()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.BLACK
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY

                  val splashImage = ImageView(this).apply {
                      id = SPLASH_IMAGE_ID
                      setImageResource(R.drawable.splash_stage_one)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setBackgroundColor(Color.rgb(2, 6, 23))
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                      contentDescription = null
                  }
                  setContentView(splashImage)

                  handler.postDelayed(showSecondStage, 700L)
                  handler.postDelayed(openApplication, 5000L)
              }

              override fun onDestroy() {
                  handler.removeCallbacks(showSecondStage)
                  handler.removeCallbacks(openApplication)
                  super.onDestroy()
              }

              companion object {
                  private const val SPLASH_IMAGE_ID = 0x595301
              }
          }
          KOTLIN

          python3 - <<'PYPATCH'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("YS_Business_Smart_Rebuild_Phase1")
          manifest_path = root / "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"

          tree = ET.parse(manifest_path)
          manifest = tree.getroot()
          application = manifest.find("application")
          if application is None:
              raise SystemExit("AndroidManifest application node was not found")

          main_activity = None
          launcher_filter = None
          for activity in application.findall("activity"):
              name = activity.get(android + "name", "")
              if name.endswith("MainActivity"):
                  main_activity = activity
              for intent_filter in activity.findall("intent-filter"):
                  actions = [a.get(android + "name", "") for a in intent_filter.findall("action")]
                  categories = [c.get(android + "name", "") for c in intent_filter.findall("category")]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      launcher_filter = (activity, intent_filter)

          if main_activity is None:
              raise SystemExit("MainActivity was not found in AndroidManifest.xml")

          if launcher_filter is not None:
              launcher_filter[0].remove(launcher_filter[1])

          for activity in list(application.findall("activity")):
              if activity.get(android + "name", "") in (".SplashActivity", "com.ysbusiness.smart.SplashActivity"):
                  application.remove(activity)

          splash = ET.Element("activity")
          splash.set(android + "name", ".SplashActivity")
          splash.set(android + "exported", "true")
          splash.set(android + "screenOrientation", "portrait")
          splash.set(android + "theme", "@style/Theme.YSBusinessSplash")
          splash.set(android + "excludeFromRecents", "true")

          intent_filter = ET.SubElement(splash, "intent-filter")
          action = ET.SubElement(intent_filter, "action")
          action.set(android + "name", "android.intent.action.MAIN")
          category = ET.SubElement(intent_filter, "category")
          category.set(android + "name", "android.intent.category.LAUNCHER")

          children = list(application)
          insert_at = children.index(main_activity) if main_activity in children else 0
          application.insert(insert_at, splash)
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          gradle = root / "app/build.gradle.kts"
          text = gradle.read_text()
          text = text.replace("versionCode = 13", "versionCode = 14")
          text = text.replace('versionName = "1.0.12-phase1-fix12"', 'versionName = "1.0.13-dual-splash-fix13"')
          gradle.write_text(text)
          PYPATCH

          grep -q 'android:name=".SplashActivity"' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'versionName = "1.0.13-dual-splash-fix13"' "$ROOT/app/build.gradle.kts"
          test -s "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_one.png"
          test -s "$ROOT/app/src/main/res/drawable-nodpi/splash_stage_two.png"

      - name: Run unit tests
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: YS_Business_Smart_Rebuild_Phase1
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare output
        shell: bash
        run: |
          mkdir -p output
          cp YS_Business_Smart_Rebuild_Phase1/app/build/outputs/apk/debug/app-debug.apk output/YS-Business-Smart-Dual-Splash-Fix13.apk
          zip -qr output/YS-Business-Smart-Dual-Splash-Fix13-Source.zip YS_Business_Smart_Rebuild_Phase1
          sha256sum output/* > output/SHA256.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: YS-Business-Smart-Dual-Splash-Fix13
          path: output/
          if-no-files-found: error
          retention-days: 14
